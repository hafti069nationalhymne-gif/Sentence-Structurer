[project]
name = "claimcomposer"
version = "0.1.0"
description = "ClaimComposer: questionnaire that recommends regulation-based environmental claims (research prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "shellcheck-py>=0.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
